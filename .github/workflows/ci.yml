name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dirview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/ratatui/templates/dirview

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skills/ratatui/templates/dirview

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

      - name: pty smoke test
        run: python3 ../../scripts/pty-smoke.py --tiny-text 'too small' --quit-keys 'q' --check-ctrl-c --check-color --check-resize target/debug/dirview .

      - name: lint slop
        run: ../../scripts/lint-slop.sh .

  todo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: todo

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

      - name: pty smoke test
        run: python3 ../skills/ratatui/scripts/pty-smoke.py --quit-keys 'q' --check-ctrl-c --check-color target/debug/todo

      - name: lint slop
        run: ../skills/ratatui/scripts/lint-slop.sh .

  msrv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.88.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: check dirview at MSRV
        working-directory: skills/ratatui/templates/dirview
        run: cargo check --locked
      - name: check todo at MSRV
        working-directory: todo
        run: cargo check --locked

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shell syntax
        run: bash -n skills/ratatui/scripts/*.sh
      - name: python syntax
        run: python3 -m py_compile skills/ratatui/scripts/pty-smoke.py
      - name: crate-versions smoke
        run: skills/ratatui/scripts/crate-versions.sh ratatui | grep -q 'ratatui'

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: README emoji headers
        run: |
          if head -20 README.md | grep -qP '^#+ .*[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]'; then
            echo "emoji found in README header" && exit 1
          fi
