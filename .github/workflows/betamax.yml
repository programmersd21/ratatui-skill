name: Betamax

on:
  pull_request:

permissions: {}

concurrency:
  group: betamax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Build dirview
        run: cargo build --manifest-path skills/ratatui/templates/dirview/Cargo.toml

      - name: Run terminal interaction tape
        uses: joshka/betamax-action@bc6fa6bfb5e20dd342b588601f4e1a945661d5fe
        with:
          tapes: tapes/**/*.tape
          formats: gif,png