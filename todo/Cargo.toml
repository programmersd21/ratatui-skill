[package]
name = "todo-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small persistent todo list TUI"
license = "MIT"
publish = false

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
color-eyre = "0.6.5"
unicode-width = "0.2.3"

[lints.clippy]
unwrap_used = "deny"
print_stdout = "warn"
dbg_macro = "deny"
todo = "deny"
